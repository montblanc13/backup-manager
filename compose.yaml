# Backup Manager : application Nuxt + base SQLite persistante
name: backup-manager

services:
  app:
    container_name: backup-manager
    build: .
    # Image locale construite par `build`. Pour utiliser l'image publiée sur GHCR à la place :
    # APP_IMAGE=ghcr.io/montblanc13/sla-backup-manager:latest (variable d'environnement ou .env)
    image: ${APP_IMAGE:-backup-manager:latest}
    restart: unless-stopped
    # Utilisateur du conteneur (défaut : `node`, uid/gid 1000, non-root).
    # Docker ROOTLESS : l'uid 1000 du conteneur n'est PAS votre uid d'hôte (il correspond à un
    # uid secondaire), donc ./data et le HOME monté sont inaccessibles ("unable to open database
    # file"). Dans ce cas, définir APP_UID=0 et APP_GID=0 (.env) : le root du conteneur est alors
    # votre utilisateur d'hôte, sans privilège supplémentaire sur la machine.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      # Publié uniquement sur la boucle locale de l'hôte (inaccessible depuis le réseau).
      # Port hôte réglable via PORT (variable d'environnement ou fichier .env, comme en
      # dev), 9090 par défaut. Le port interne du conteneur reste fixe (3000).
      - "127.0.0.1:${PORT:-9090}:3000"
    # Configuration de l'application lue depuis .env (git-ignoré, modèle : .env.example).
    # Fichier facultatif ; il n'est jamais copié dans l'image (voir .dockerignore).
    env_file:
      - path: .env
        required: false
    environment:
      # Écoute sur toutes les interfaces DU conteneur (requis pour la redirection de port) ;
      # l'exposition à l'hôte est limitée à 127.0.0.1 par la section `ports`
      HOST: 0.0.0.0
      # Port interne fixe : ne pas le déduire de PORT (.env), qui règle le port hôte
      PORT: 3000
      # Migrations SQL copiées dans l'image (prioritaire sur un éventuel .env local)
      NUXT_MIGRATIONS_FOLDER: /app/migrations
      # Stockage de l'application (base dans db/, fichiers dans data/) : MÊME dossier qu'avec
      # `npm run dev`, sous le HOME de l'hôte. Le HOME étant monté à l'identique ci-dessous, ce
      # chemin hôte est valide tel quel dans le conteneur (le HOME du conteneur, lui, est autre).
      NUXT_DATA_DIR: ${NUXT_DATA_DIR:-${HOME}/.config/backup-manager}
      # Racine du sélecteur de dossier : valeur du .env, repli sur le HOME de l'hôte
      NUXT_BROWSE_ROOT: ${NUXT_BROWSE_ROOT:-${HOME}}
    volumes:
      # Le HOME de l'hôte (utilisateur qui lance `docker compose`) est monté AU MÊME CHEMIN dans
      # le conteneur : on saisit dans l'application les chemins de l'hôte, tels quels
      # (/home/moi/Documents...). Lecture/écriture : sources, destinations et stockage de l'application.
      # Attention : toute l'arborescence du HOME est accessible à l'application.
      - ${HOME}:${HOME}

      # --- Autres disques ou dossiers (hors HOME) : bind mount au MÊME chemin que sur l'hôte ---
      # Décommentez et adaptez (source en lecture seule : ajouter :ro).
      # - /mnt/sauvegardes:/mnt/sauvegardes
      # - /srv/donnees:/srv/donnees:ro
      #
      # Droits : l'utilisateur du conteneur (APP_UID/APP_GID) doit pouvoir écrire dans les
      # destinations (voir README, rubrique Docker).
